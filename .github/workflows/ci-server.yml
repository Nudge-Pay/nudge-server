name: Server CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.github/workflows/ci-server.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'nest-cli.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.github/workflows/ci-server.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --no-fix

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e

  summary:
    name: Summary Gate
    runs-on: ubuntu-latest
    needs: [server]
    if: always()
    steps:
      - name: Verify dependency job statuses
        run: |
          if [ "${{ needs.server.result }}" != "success" ]; then
            echo "Error: Required upstream job 'server' failed with status: ${{ needs.server.result }}"
            exit 1
          fi
          echo "All upstream dependency checks passed successfully."
