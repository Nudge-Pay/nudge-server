name: WebAuthn cleanup integration

on:
  pull_request:
    paths:
      - 'src/webauthn/**'
      - 'prisma/**'
      - 'test/webauthn-cleanup.db-spec.ts'
      - 'package*.json'
      - '.github/workflows/webauthn-cleanup.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nudge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/nudge_test
      DIRECT_URL: postgresql://test:test@localhost:5432/nudge_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/nudge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npx jest --runInBand --testRegex 'webauthn-cleanup.db-spec.ts$'
